name: Initra CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Python sources
        run: python -m compileall -q main.py app

      - name: Validate version metadata
        run: |
          test "$(tr -d '\r\n ' < VERSION)" = "3.1.0"
          grep -q 'VERSION = "3.1.0"' app/services/app_info.py
